# This is a Databricks asset bundle definition for bakehouse_analytics_bundle_dev.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics_bundle_dev
  uuid: 86ace503-98b2-4b9d-95a6-8084c8ff8f8e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5384731b-3a63.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rmd
  prod:
    mode: production
    workspace:
      host: https://dbc-5384731b-3a63.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rishavmaws@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rishavmaws@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rmd
    permissions:
      - user_name: rishavmaws@gmail.com
        level: CAN_MANAGE
